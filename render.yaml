# Render Blueprint — API, static frontend, and ACM.
# Dashboard → New → Blueprint → connect this repository.
# Set secret env vars when prompted (DB passwords, CORS, VITE URLs).

services:
  - type: web
    name: l2website-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: l2website
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://l2website-api.onrender.com
      - key: VITE_ACM_URL
        value: https://l2website-acm.onrender.com
      - key: VITE_DISCORD_URL
        sync: false
      - key: VITE_DOWNLOAD_URL
        sync: false

  - type: web
    name: l2website-acm
    runtime: docker
    dockerfilePath: ./acm/Dockerfile
    dockerContext: ./acm
    envVars:
      - key: APP_NAME
        value: L2 Army
      - key: APP_SCHEME
        value: https
      - key: DEMO_MODE
        value: "false"
      - key: DB_HOST
        value: 98.29.125.109
      - key: DB_USER
        value: Bubba
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: lineage2army
      - key: DB_GAME_HOST
        value: 98.29.125.109
      - key: DB_GAME_USER
        value: Bubba
      - key: DB_GAME_PASS
        sync: false
      - key: DB_GAME_NAME
        value: lineage2army
      - key: LOGIN_HOST
        value: 98.29.125.109
      - key: LOGIN_PORT
        value: "2106"
      - key: GAME_HOST
        value: 98.29.125.109
      - key: GAME_PORT
        value: "7777"
